name: teslamate

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  teslamate:
    image: teslamate/teslamate:latest
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file:
      - teslamate.env
    ports:
      - "4000:4000"
    volumes:
      - ./import:/opt/app/import

  # 手机客户端只读 API（项目：api/，鉴权：Bearer $API_TOKEN）
  api:
    build: ./api
    restart: unless-stopped
    environment:
      - API_TOKEN=${API_TOKEN}
      - TZ_NAME=Asia/Shanghai
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASS=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_SSL_MODE=disable
      - APP_VERSION_CODE=${APP_VERSION_CODE}
      - APP_VERSION_NAME=${APP_VERSION_NAME}
      - APP_APK_URL=${APP_APK_URL}
      - APP_RELEASE_NOTES=${APP_RELEASE_NOTES}
      - APP_MANDATORY=${APP_MANDATORY}
      - AMAP_KEY=${AMAP_KEY}
      # 铭牌（出厂标称）电池容量 kWh —— 电池健康度的分母。
      # 本车 = 小鹏/特斯拉 Model 3 LR AWD Performance (P74D)，铭牌 76.8 kWh。
      # 换车只需改这里，不用改代码。
      - NOMINAL_BATTERY_KWH=${NOMINAL_BATTERY_KWH}
      # ── Tesla Fleet API（只读，用于锁车状态）────────────────────────
      # 没配就整组留空 —— 服务端会优雅降级成「锁车状态未知」，主服务零影响。
      # ⚠️ 这里**不能**用 env_file: .env 一次性全注入：
      #    .env 里还有 POSTGRES_PASSWORD、AMAP_KEY 等，没必要给 api 容器。
      #    显式列出需要的四个键，多余的密钥不进容器。
      - TESLA_CLIENT_ID=${TESLA_CLIENT_ID}
      - TESLA_CLIENT_SECRET=${TESLA_CLIENT_SECRET}
      - TESLA_REFRESH_TOKEN=${TESLA_REFRESH_TOKEN}
      - TESLA_REGION=${TESLA_REGION}
      # ── Tesla 车控（v0.66.0：车控下沉到本项目）────────────────────
      # command-proxy 是 Tesla 官方的 vehicle-command sidecar（做签名命令）。
      # ⚠️ 它在 `control` profile 里 —— 密钥卷没准备好时不让它拖垮整个栈：
      #    docker compose --profile control up -d command-proxy
      # 没起 proxy 时车控端点会明确回「代理没起来」，其余功能零影响。
      - TESLA_COMMAND_PROXY_URL=${TESLA_COMMAND_PROXY_URL}
      - TESLA_COMMAND_PROXY_CA=${TESLA_COMMAND_PROXY_CA}
      # ── v0.79.0 3/3：Fleet Telemetry 数据落地 ─────────────────────
      # 故障码（BMS_*/DI_*/VCFRONT_*/CP_*）只有这一条路能拿到 ——
      # vehicle_data 端点里根本没有这些字段。
      # 车 → fleet-telemetry → mosquitto → 本服务 → Postgres。
      - TELEMETRY_MQTT_URL=tcp://mosquitto:1883
      - TELEMETRY_MQTT_TOPIC_BASE=tesla_telemetry
      # 车端要连的遥测服务器（与 fleet-telemetry 的 8443 入口同一个域名）。
      - TELEMETRY_HOST=<主机名>.<tailnet域>.ts.net
      - TELEMETRY_PORT=8443
      # 服务器证书链（公开可信的 Let's Encrypt 证书）——
      # 车端用它验证我们的服务器。⚠️ 车端信任库里**不能**有叶子证书，
      #    所以程序会自己剥掉第一段，只留中间证书 + 根证书。
      - TELEMETRY_CA_FILE=/telemetry_certs/server.crt
    depends_on:
      database:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8090:8090"
    volumes:
      - ./apk:/apk:ro
      # ⚠️ **可写**挂载：Fleet API 的 refresh_token 是**一次性**的（有效期 3 个月），
      # 每次刷新服务端都会拿到新 token 并轮换回写这个文件 —— 写不回就等于 3 个月后
      # 要重新走一遍浏览器授权。挂目录（而不是单文件）能让 rename 原子替换可用；
      # 挂单文件时 rename 会 EBUSY，服务端会自动退化成原地覆写（仍能工作，只是不原子）。
      - ./.env:/app/.env
      # 车控代理的**自签证书**（公开证书，不含私钥）——
      # api 容器要信它才能跟 proxy 说 HTTPS。
      # ⚠️ 只挂证书，不挂私钥卷：api 容器不需要车辆私钥。
      - command_ca:/command_ca:ro
      # 遥测服务器证书链（**公开证书**，不含私钥）——
      # 下发 fleet_telemetry_config 时要把 CA 串塞进 JWT 交给车端。
      # ⚠️ 这个目录在 OneDrive **外面**（证书不该被同步）。
      - ${CERTS_DIR}:/telemetry_certs:ro

  # ⚠️ v0.66.0：Tesla 车控代理（官方 tesla/vehicle-command sidecar）。
  #
  # 为什么需要它：2021 年后的 Model 3/Y 发「签名命令」必须用
  # **注册在 Tesla partner account 上的那把私钥**做 ECDSA 签名，
  # 业务代码做不了 —— Tesla 官方把这套协议实现成了这个 sidecar。
  #
  # ⚠️ 镜像源用 Docker Hub（2026-10-24 实测）：
  #    `ghcr.io/teslamotors/vehicle-command` 匿名拿 token 直接 403（镜像已私有/受限），
  #    Docker Hub 上的 `tesla/vehicle-command` 是同一个官方镜像，参数一致。
  command-proxy:
    image: tesla/vehicle-command:latest
    container_name: teslamate-command-proxy
    profiles: ["control"]
    restart: unless-stopped
    command:
      - -tls-key=/data/tls-key.pem
      - -key-file=/data/private-key.pem
      - -cert=/data/tls-cert.pem
      - -port=4443
      # ⚠️ **-host 必须显式给 0.0.0.0**：不传的话 sidecar 默认只听 **localhost**
      # （日志实测 `Listening on localhost:4443`）→ api 容器连不上。
      - -host=0.0.0.0
      - -verbose
    volumes:
      # 车辆私钥 + TLS 证书（**只在这个卷里，不入库**）
      - command_keys:/data
    networks:
      default:
        aliases:
          - command-proxy

  # ── v0.79.0：Tesla Fleet Telemetry 接收端 ───────────────────────
  #
  # 为什么要有它：我们是**轮询** vehicle_data 拿车况的 ——
  # 车每次都要被唤醒一次，既费电又有尾流费。
  # Fleet Telemetry 是反过来：**车主动把数据推给我们**，
  # 车在线时几乎零成本，睡着时完全不打扰。
  #
  # ⚠️ 它收到的数据里有**故障码**（BMS_*/DI_*/VCFRONT_*/CP_*）——
  #    这是轮询 vehicle_data 拿不到的东西（本项目 v0.78.0 之前一直缺）。
  #
  # ⚠️ **没有 tls 段**：TLS 由 Tailscale Funnel 终止（公开可信的 LE 证书），
  #    容器里跑明文 HTTP/WS。端口只绑 **127.0.0.1** ——
  #    对局域网不可见，公网入口只有 Tailscale 那一条。
  #    （官方建议 mTLS 终止在接收端；自用场景下车辆身份由应用层 JWT 保证。）
  fleet-telemetry:
    image: tesla/fleet-telemetry:latest
    container_name: teslamate-fleet-telemetry
    restart: unless-stopped
    command: ["/fleet-telemetry", "-config=/etc/fleet-telemetry/config.json"]
    # ⚠️ v0.79.0 3/3：遥测数据要落到本机的 mosquitto（官方 mqtt dispatcher），
    #    再由 api 容器订阅入库。没有它的话车端连上了也只是一堆容器日志。
    depends_on:
      mosquitto:
        condition: service_started
    volumes:
      - ./fleet-telemetry/config.json:/etc/fleet-telemetry/config.json:ro
      # 服务器证书 = **Tailscale 签的 Let's Encrypt 证书**（公开可信，Tesla 会验）。
      # ⚠️ 必须是公网可信的：Tesla 直接看到这张证书（Funnel 用 raw TCP 透传，
      #    TLS 端到端，不在 Tailscale 那边终止）⇒ 自签会被 Tesla 拒。
      # ⚠️ 这个目录在 OneDrive **外面**（证书不该被同步），由
      #    scripts/renew-telemetry-cert.ps1 每周续期后重启本容器。
      - ${CERTS_DIR}:/certs:ro
    ports:
      # ⚠️ 只绑回环：明文 WS 不许暴露到局域网。
      - "127.0.0.1:4443:4443"
      - "127.0.0.1:9090:9090"

  grafana:
    # 中文仪表盘版（https://github.com/wjsall/teslamate-chinese-dashboards）
    # 原官方镜像：teslamate/grafana:latest（回滚见 compose.yaml.bak.*）
    image: ghcr.io/wjsall/teslamate-chinese-dashboards:latest
    restart: unless-stopped
    depends_on:
      - teslamate
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - DATABASE_USER=${POSTGRES_USER}
      - DATABASE_PASS=${POSTGRES_PASSWORD}
      - DATABASE_NAME=${POSTGRES_DB}
      - DATABASE_HOST=database
      - DATABASE_PORT=5432
      - DATABASE_SSL_MODE=disable
    ports:
      - "3000:3000"
    volumes:
      # 中文仪表盘内置于镜像 /dashboards 与 /dashboards_internal，不要从宿主机挂载覆盖
      - ./grafana/data:/var/lib/grafana

volumes:
  # 车控密钥卷：车辆私钥 + TLS 证书（**只在这里，不入库**）
  command_keys:
  # 只给 api 容器看的**公开**自签证书
  command_ca:
